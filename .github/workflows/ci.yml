name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build, vet, fmt, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go test (race, cover)
        run: go test ./... -race -count=1 -cover

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  govulncheck:
    name: govulncheck (informational)
    runs-on: ubuntu-latest
    # Known-unpatched upstream advisory GO-2026-4736 in gobgp/v3@v3.37.0
    # (see README.md "Open questions" -- tracked, but a second-round
    # adversarial review found govulncheck's reachability trace through
    # this repo's own call path to be an over-approximation: the
    # advisory's actual vulnerable code is in gobgp's pkg/server, which
    # this repo does not import) means this job is expected to report a
    # finding today with no fixed version available yet. It runs for
    # visibility -- so a *new* advisory doesn't go unnoticed -- without
    # blocking CI on the pre-existing one. continue-on-error keeps it
    # informational rather than gating.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...
